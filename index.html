<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Samia ❤️</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at center, #140016, #000);
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

.overlay {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  font-size: 1.5em;
  cursor: pointer;
}

.title {
  font-size: 2.7em;
  margin-top: 20px;
  color: #ff99cc;
  text-shadow: 0 0 15px #ff4da6;
  font-family: cursive;
}

.heart {
  font-size: 55px;
  animation: pulse 1.2s infinite;
}

.box {
  margin: 20px;
  padding: 25px;
  border-radius: 20px;
  background: rgba(255, 105, 180, 0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 0 25px rgba(255,105,180,0.3);
}

p {
  line-height: 1.7;
  font-size: 1.1em;
  min-height: 180px;
}

.video-box video {
  width: 90%;
  max-width: 400px;
  border-radius: 15px;
  margin-top: 10px;
  box-shadow: 0 0 20px rgba(255,105,180,0.4);
  opacity: 0;
  transition: 2s;
}

.love {
  font-size: 2.2em;
  margin: 20px;
  color: #ff80bf;
  text-shadow: 0 0 10px #ff4da6;
  opacity: 0;
  transition: 2s;
}

.heart-float {
  position: fixed;
  bottom: -20px;
  color: rgba(255, 77, 166, 0.25);
  pointer-events: none;
  animation: floatUp linear infinite;
}

@keyframes pulse {
  0% {transform: scale(1);}
  50% {transform: scale(1.15);}
  100% {transform: scale(1);}
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 0.5; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* Footer */
.footer {
  margin: 40px auto 20px;
  padding: 12px 20px;
  width: fit-content;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 0 20px rgba(255, 105, 180, 0.2);
  font-size: 14px;
  color: rgba(255,255,255,0.6);
}

.footer a {
  color: #ff80bf;
  text-decoration: none;
  font-weight: bold;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.fb-icon {
  width: 18px;
  height: 18px;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">Tap to start 💖</div>

<div class="title">Welcome Samia 💖</div>
<div class="heart">❤️</div>

<div class="box">
  <p id="typing"></p>
</div>

<div class="video-box">
  <video id="vid" autoplay muted loop playsinline>
    <source src="https://res.cloudinary.com/drig9vgsr/video/upload/your-video_t3nmyf.mp4">
  </video>
</div>

<div class="love" id="love">I Love You Samia ❤️</div>

<!-- 🎵 MUSIC (FIXED RAW LINK) -->
<audio id="music" loop preload="auto">
  <source src="https://raw.githubusercontent.com/CARZYSAIFUL/Samia.love/4709e2e53b908fbe6ca00f3115916681de6be0bb/your-music.mp3" type="audio/mp3">
</audio>

<!-- Footer -->
<div class="footer">
  Developed by 
  <a href="https://www.facebook.com/uponnashpremik" target="_blank">
    <svg class="fb-icon" viewBox="0 0 24 24">
      <path fill="#1877f2"
        d="M22 12A10 10 0 1 0 10.5 21.9v-7h-2.2V12h2.2V9.8c0-2.2 1.3-3.4 3.3-3.4.96 0 1.96.17 1.96.17v2.2h-1.1c-1.1 0-1.44.68-1.44 1.38V12h2.45l-.39 2.9h-2.06v7A10 10 0 0 0 22 12z"/>
    </svg>
    SAIFUL
  </a>
</div>

<script>
const text = `একটা কথা বলি?

তোমার সাথে কথা বলতে আমার ভালো লাগে।
তোমার ওই একটু রাগী voice টা—honestly অনেক cute লাগছে।

আমি বুঝতে পারছি, ধীরে ধীরে তোমাকে আলাদা করে notice করছি।

আমি তোমাকে পছন্দ করি।
তুমি কী ভাবো জানালে ভালো লাগবে।`;

let i = 0;

function type(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 40);
  } else {
    document.getElementById("vid").style.opacity = "1";
    document.getElementById("love").style.opacity = "1";
  }
}

const music = document.getElementById("music");

function start(){
  document.getElementById("overlay").style.display = "none";
  music.play().catch(()=>{});
  type();
}

/* fallback */
document.addEventListener("click", () => {
  music.play().catch(()=>{});
}, { once: true });

document.getElementById("overlay").onclick = start;

/* hearts */
function createHeart(){
  const h = document.createElement('div');
  h.className = 'heart-float';
  h.innerHTML = '❤️';
  h.style.left = Math.random()*100 + 'vw';
  h.style.fontSize = (Math.random()*20 + 15) + 'px';
  h.style.animationDuration = (Math.random()*3 + 5) + 's';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
}
setInterval(createHeart, 300);
</script>

</body>
</html>
