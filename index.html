<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Samia ❤️</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle at center, #140016, #000);
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* Overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  font-size: 1.5em;
  cursor: pointer;
}

/* Title */
.title {
  font-size: 2.5em;
  margin-top: 20px;
  color: #ff99cc;
}

/* Box */
.box {
  margin: 20px;
  padding: 20px;
  background: rgba(255,105,180,0.1);
  border-radius: 15px;
}

/* Video */
video {
  width: 90%;
  max-width: 400px;
  border-radius: 10px;
  margin-top: 10px;
  opacity: 0;
  transition: 2s;
}

/* Bottom */
.love {
  font-size: 2em;
  margin-top: 15px;
  opacity: 0;
  transition: 2s;
}

/* Footer */
.footer {
  margin: 30px 0;
  font-size: 14px;
  color: rgba(255,255,255,0.6);
}

.footer a {
  color: #ff80bf;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">Tap to start 💖</div>

<h1 class="title">Welcome Samia 💖</h1>

<div class="box">
  <p id="typing"></p>
</div>

<video id="vid" autoplay muted loop playsinline>
  <source src="https://res.cloudinary.com/drig9vgsr/video/upload/your-video_t3nmyf.mp4">
</video>

<h2 class="love" id="love">I Love You Samia ❤️</h2>

<!-- 🎵 MUSIC -->
<audio id="music" loop preload="auto">
  <source src="https://raw.githubusercontent.com/USERNAME/REPO/main/your-music.mp3">
</audio>

<!-- Footer -->
<div class="footer">
  Developed by 
  <a href="https://www.facebook.com/uponnashpremik" target="_blank">SAIFUL</a>
</div>

<script>
const text = `একটা কথা বলি?

তোমার সাথে কথা বলতে আমার ভালো লাগে।
তোমার ওই একটু রাগী voice টা—honestly অনেক cute লাগছে।

আমি বুঝতে পারছি, ধীরে ধীরে তোমাকে আলাদা করে notice করছি।

আমি তোমাকে পছন্দ করি।
তুমি কী ভাবো জানালে ভালো লাগবে।`;

let i = 0;

function type(){
  if(i < text.length){
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 40);
  } else {
    document.getElementById("vid").style.opacity = "1";
    document.getElementById("love").style.opacity = "1";
  }
}

const music = document.getElementById("music");
const overlay = document.getElementById("overlay");

/* MAIN START */
function start(){
  overlay.style.display = "none";

  playMusic();
  type();
}

/* STRONG PLAY FUNCTION */
function playMusic(){
  music.currentTime = 0;
  music.volume = 0.8;

  let promise = music.play();

  if (promise !== undefined) {
    promise.catch(() => {
      console.log("Retry needed");
    });
  }
}

/* CLICK EVENTS */
overlay.addEventListener("click", start);

/* GLOBAL fallback (MOST IMPORTANT) */
document.addEventListener("click", function(){
  music.play().catch(()=>{});
}, { once: true });

</script>

</body>
</html>
